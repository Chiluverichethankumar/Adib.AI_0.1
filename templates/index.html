<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adib.AI</title>
  <link rel="icon" href="{{ url_for('static', filename='logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<div class="page">
  <header class="header">
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Adib.AI">
      <h2>Adib.AI</h2>
    </div>
    <div>
      <button class="new-chat" onclick="clearChat()">New Chat</button>
      <button class="feedback-btn" onclick="openFeedback()">Feedback</button>
    </div>
  </header>

  <!-- Chat messages -->
  <div id="messages" class="messages"></div>

  <!-- Input box -->
  <div class="input-container">
    <div class="input-box">
      <input type="text" id="user-input" placeholder="Ask me anything..." autofocus>
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<!-- Feedback Modal -->
<div class="feedback-modal" id="feedbackModal">
  <div class="feedback-card">
    <h3>Help us get better</h3>
    <form id="feedback-form">
      <input type="text" id="fb-name" placeholder="Name (optional)">
      <input type="email" id="fb-email" placeholder="Email" required>
      <textarea id="fb-message" placeholder="Your feedback..." rows="3" required></textarea>
      <button type="submit">Send Feedback</button>
      <button type="button" onclick="closeFeedback()" class="close-btn">Close</button>
      <div id="fb-status"></div>
    </form>
  </div>
</div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
function openFeedback() {
  document.getElementById('feedbackModal').style.display = 'flex';
}
function closeFeedback() {
  document.getElementById('feedbackModal').style.display = 'none';
}
</script>
</body>
</html>
